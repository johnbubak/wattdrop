# ==============================================================================
# WATTDROP — ECO-PERFORMANCE SERVER-SIDE DROP-IN (nginx)
# ==============================================================================
# 1. Stops 404 spam for icons and missing images
# 2. Speeds up JS/CSS with modern compression and hard caching
# ==============================================================================

# --- PART 1: Zero-Icon (the core of WattDrop) ---
# Catches all missing standard icons. Real icon files on disk are still
# served normally (try_files); only missing ones get 204 No Content.
# Saves CPU, SSD-I/O and traffic — the app behind nginx never wakes up.
location ~* ^/(favicon\.ico|favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon.*\.png)$ {
    access_log off;
    log_not_found off;
    try_files $uri @missing_icon;
}

location @missing_icon {
    access_log off;
    log_not_found off;
    return 204;  # 204 No Content -> maximum eco mode
}

# --- PART 2: Graceful Image Fallback ---
# Broken images don't throw errors; they get a silent 1x1 SVG instead.
location ~* \.(jpg|jpeg|png|gif|webp)$ {
    try_files $uri @missing_image;
}

location @missing_image {
    access_log off;
    log_not_found off;
    default_type image/svg+xml;
    # Tiny invisible placeholder SVG
    return 200 '<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"/>';
}

# --- PART 3: JS & CSS Performance Turbo ---
# Modern browsers use HTTP/2 multiplexing. Don't hack your frontend to bundle
# scripts dynamically — aggressively cache and compress instead.
location ~* \.(css|js)$ {
    # 1. Hard caching: the browser downloads the file only once
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # 2. No log spam for every loaded asset
    access_log off;
    # 3. Serve real files cleanly
    try_files $uri =404;
}

# --- Global gzip (enable if not already set in the main nginx config) ---
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/css
    application/javascript
    image/svg+xml;